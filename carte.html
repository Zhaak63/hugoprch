<style>
:root{--bg:#0c0c0b;--fg:#ecebe6;--mute:#8a8983;--line:#262624;--accent:#d9c7a3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:linear-gradient(180deg,rgba(12,12,11,.92),rgba(12,12,11,0))}
.logo{font-weight:600;letter-spacing:-.02em;font-size:18px}.logo sup{font-size:10px;font-weight:400}
nav ul{display:flex;gap:26px;list-style:none;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
nav ul a{opacity:.85}nav ul a:hover,nav ul a.on{opacity:1;color:var(--accent)}
#map{position:fixed;inset:0;background:#0c0c0b}
.leaflet-container{background:#0c0c0b;font-family:inherit}
.dark-tiles{filter:brightness(.78) contrast(1.05)}

.sat-tiles{filter:brightness(.8) saturate(.85) contrast(1.05)}
.layer{position:fixed;right:22px;top:76px;z-index:900;background:rgba(12,12,11,.8);backdrop-filter:blur(8px);border:1px solid #444;color:var(--fg);border-radius:99px;padding:8px 16px;font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.leaflet-control-attribution{background:rgba(12,12,11,.7)!important;color:#777!important;font-size:10px}
.leaflet-control-attribution a{color:#999!important}
.leaflet-control-zoom a{background:#141413!important;color:var(--fg)!important;border-color:#2a2a27!important}
.head{position:fixed;left:28px;top:84px;z-index:900;max-width:420px;pointer-events:none}
.head .lb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.head h1{font-size:clamp(36px,4.6vw,64px);font-weight:500;letter-spacing:-.045em;line-height:.95;margin-top:8px}
.filters{position:fixed;left:28px;top:clamp(210px,24vh,250px);z-index:900;display:flex;flex-direction:column;gap:6px}
.filters button{display:flex;align-items:center;gap:9px;background:rgba(12,12,11,.78);backdrop-filter:blur(8px);border:1px solid #2e2e2b;color:#c9c8c2;font:inherit;font-size:13px;padding:7px 14px 7px 9px;border-radius:99px;cursor:pointer;transition:all .25s;width:max-content;white-space:nowrap;flex:none}
.filters button svg{width:18px;height:18px;flex:none}
.filters button:hover{border-color:#555;color:var(--fg)}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pin{width:38px;height:38px;border-radius:50%;background:#0c0c0b;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.6);transition:transform .25s}
.pin svg{width:19px;height:19px}
.pin:hover,.pin.sel{transform:scale(1.18);background:var(--accent);color:#0c0c0b}
.leaflet-tooltip.tt{background:#0c0c0b;color:var(--fg);border:1px solid #2e2e2b;border-radius:6px;font-size:13px;padding:5px 10px;box-shadow:none}
.leaflet-tooltip.tt::before{display:none}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:1100;background:#0c0c0b;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.panel.open{transform:none}
.pclose{position:absolute;top:16px;right:16px;z-index:3;background:rgba(12,12,11,.7);backdrop-filter:blur(6px);border:1px solid #444;color:var(--fg);border-radius:99px;padding:8px 14px;font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pimg{position:relative;height:42vh;min-height:240px;flex:none;overflow:hidden;background:#151513}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
.thumbs{position:absolute;left:16px;bottom:14px;display:flex;gap:6px}
.thumbs button{width:44px;height:44px;border-radius:5px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none;opacity:.7}
.thumbs button.on{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pbody{padding:24px 26px 30px;overflow-y:auto;flex:1}
.pbody .lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pbody h2{font-size:38px;font-weight:500;letter-spacing:-.04em;line-height:1;margin:8px 0 6px}
.pbody .sub{font-size:14px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 20px}
.tags span{display:flex;align-items:center;gap:7px;border:1px solid #2e2e2b;border-radius:99px;padding:6px 12px 6px 8px;font-size:12.5px;color:#d6d5cf}
.tags svg{width:16px;height:16px;color:var(--accent)}
.facts{border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts div span:first-child{color:var(--mute)}
.facts div span:last-child{text-align:right}
.note{margin-top:20px;font-size:15px;line-height:1.55;color:#cfcdc6}
.note b{color:var(--fg);font-weight:500}
.go{display:inline-flex;margin-top:22px;gap:10px;flex-wrap:wrap}
.go a{border:1px solid #444;border-radius:99px;padding:10px 16px;font-size:13px}
.go a:first-child{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{position:fixed;left:28px;bottom:24px;z-index:900;font-size:12px;color:var(--mute);letter-spacing:.06em}
@media (max-width:760px){
 nav{padding:14px 18px}nav ul{gap:14px;font-size:11px}nav ul .m-hide{display:none}

 const img=document.getElementById('pImg');img.src=s.ph[0];img.alt=s.t;
 const th=document.getElementById('pThumbs');th.innerHTML='';
 if(s.ph.length>1)s.ph.forEach((src,i)=>{const b=document.createElement('button');if(!i)b.classList.add('on');b.innerHTML=`<img src="${src}" alt="">`;b.onclick=()=>{img.src=src;th.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};th.appendChild(b)});
 pMassif.textContent=s.m;pTitle.textContent=s.t;pSub.textContent='Altitude '+s.alt;
 pTags.innerHTML=s.tags.map(t=>`<span>${I[t]}${L_[t]}</span>`).join('');
 pFacts.innerHTML=s.f.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join('');
 pNote.innerHTML=s.n;
 pMaps.href=`https://www.google.com/maps/dir/?api=1&destination=${s.ll[0]},${s.ll[1]}`;
 P.classList.add('open');P.setAttribute('aria-hidden','false');
 map.flyTo(s.ll,Math.max(map.getZoom(),11),{duration:.9});
 history.replaceState(null,'','#'+s.id);
}
function closeSpot(){P.classList.remove('open');P.setAttribute('aria-hidden','true');document.querySelectorAll('.pin').forEach(p=>p.classList.remove('sel'));history.replaceState(null,'',location.pathname)}
pclose.onclick=closeSpot;addEventListener('keydown',e=>{if(e.key==='Escape')closeSpot()});
const h=location.hash.slice(1);const start=SPOTS.find(s=>s.id===h);if(start)setTimeout(()=>openSpot(start),400);
</script>
